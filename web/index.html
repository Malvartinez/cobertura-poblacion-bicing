<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobertura Bicing</title>
<meta name="description" content="Población de Barcelona que vive a menos de 250 m, 250–500 m o más de 500 m andando de una estación de Bicing.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('bicing_tema')||'dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="brand">Cobertura Bicing</div>
  <div class="seg" id="seg-lvl" role="group" aria-label="Agregación">
    <button data-v="secciones" class="on">Secciones</button><button data-v="barrios">Barrios</button><button data-v="distritos">Distritos</button>
  </div>
  <div class="sp"></div>
  <a href="#" id="about" class="lnk">Metodología</a>
  <button class="ib" id="help" title="Ayuda">?</button>
  <button class="ib" id="theme" title="Cambiar tema">☀</button>
</header>
<div class="app">
  <div class="mapwrap">
    <div id="map"></div>
    <button class="ib floating" id="collapse" title="Mostrar/ocultar panel">⇥</button>
    <div class="card legend" id="legend"></div>
  </div>
  <aside class="panel" id="panel">
    <div class="sum" id="sum"></div>
    <div class="tabs"><button data-tab="rank" class="on">Zonas</button><button data-tab="est">Estaciones</button><button data-tab="amp">Ampliación</button><button data-tab="tabla">Tabla</button></div>
    <div class="tools" id="zone-tools">
      <div class="seg sm" id="seg-rank"><button data-v="distritos" class="on">Distritos</button><button data-v="barrios">Barrios</button></div>
      <input id="q" type="search" placeholder="Buscar…">
    </div>
    <div class="tools" id="rank-tools">
      <select id="sort"><option value="v">% verde</option><option value="r">% rojo</option><option value="pob_r">Pob. sin cobertura</option></select>
      <button class="btn" id="order">Mejor → peor</button>
    </div>
    <div class="tools" id="tab-tools" hidden><span class="muted" id="tcount"></span><button class="btn" id="csv">↓ CSV</button></div>
    <div class="tools st-tools" id="st-tools" hidden>
      <div class="seg sm" id="seg-st"><button data-v="a" class="on">&lt; 250 m</button><button data-v="b">250–500 m</button><button data-v="t">Total &lt; 500 m</button></div>
      <button class="btn" id="st-order">Más → menos</button>
    </div>
    <div class="tools st-tools" id="st-tools2" hidden>
      <input id="st-q" type="search" placeholder="Buscar estación, distrito o barrio…">
      <label class="chk"><input type="checkbox" id="st-near"> Solo la base más cercana</label>
    </div>
    <div class="st-note muted" id="st-note" hidden></div>
    <div class="st-sum" id="st-sum" hidden></div>
    <div class="body" id="rank"></div>
    <div class="body" id="stlist" hidden></div>
    <div class="amp" id="amp" hidden>
      <div class="amp-top" id="amp-top"></div>
      <div class="body" id="amplist"></div>
    </div>
    <div class="body" id="tabla" hidden></div>
  </aside>
</div>

<div id="modal" class="modal" hidden>
  <div class="card ob" role="dialog" aria-modal="true">
    <div id="ob-body"></div>
    <div class="ob-foot">
      <a href="#" id="ob-skip" class="lnk">Saltar</a>
      <div class="dots" id="ob-dots"></div>
      <button class="btn primary" id="ob-next">Siguiente</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="js/app.js"></script>
</body>
</html>
